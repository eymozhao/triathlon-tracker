    // ========== 密码重置 ==========
    openPwdResetModal() {
        document.getElementById('pwd-reset-step1').style.display = 'block';
        document.getElementById('pwd-reset-step2').style.display = 'none';
        document.getElementById('reset-error').style.display = 'none';
        document.getElementById('reset-username').value = '';
        document.getElementById('reset-new-password').value = '';
        document.getElementById('reset-admin-password').value = '';
        document.getElementById('pwd-reset-modal-overlay').classList.add('open');
    },
    closePwdResetModal() {
        document.getElementById('pwd-reset-modal-overlay').classList.remove('open');
    },
    async doResetPassword() {
        const username = document.getElementById('reset-username').value.trim();
        const newPassword = document.getElementById('reset-new-password').value;
        const adminPassword = document.getElementById('reset-admin-password').value;
        const errEl = document.getElementById('reset-error');
        errEl.style.display = 'none';

        if (!username) { this._showResetError('请输入用户名'); return; }
        if (!newPassword || newPassword.length < 4) { this._showResetError('新密码至少4个字符'); return; }

        // 查找目标用户
        let targetUser = null;
        try { targetUser = await DB.findUser(username); } catch(e) {}
        if (!targetUser) {
            const users = DB._getCache('tri_users', []);
            targetUser = users.find(u => u.username === username);
        }
        if (!targetUser) { this._showResetError('用户名不存在，请检查后重试'); return; }

        // 验证管理员密码（必须是管理员才能重置）
        if (!adminPassword) { this._showResetError('请输入管理员密码以确认操作'); return; }

        // 验证管理员身份
        let adminUser = null;
        const adminPwdHash = await sha256(adminPassword);
        try {
            // 先查管理员用户
            for (const adminName of ADMIN_USERNAMES) {
                try { adminUser = await DB.findUser(adminName); if (adminUser) break; } catch(e) {}
            }
            if (!adminUser) {
                const users = DB._getCache('tri_users', []);
                adminUser = users.find(u => ADMIN_USERNAMES.includes(u.username));
            }
        } catch(e) {}

        if (!adminUser) { this._showResetError('管理员账号不存在，无法重置'); return; }

        // 验证管理员密码
        const adminMatch = (adminUser.passwordHash && adminUser.passwordHash === adminPwdHash)
                        || (adminUser.password && adminUser.password === adminPassword);
        if (!adminMatch) { this._showResetError('管理员密码错误，无权操作'); return; }

        // 执行密码重置
        const newHash = await sha256(newPassword);
        try {
            await DB.updateUser(targetUser.id, { passwordHash: newHash, password: null });
            // 更新本地缓存
            const users = DB._getCache('tri_users', []);
            const idx = users.findIndex(u => u.id === targetUser.id);
            if (idx !== -1) { users[idx].passwordHash = newHash; delete users[idx].password; DB._setCache('tri_users', users); }
        } catch(e) {
            // 本地降级
            const users = DB._getCache('tri_users', []);
            const idx = users.findIndex(u => u.id === targetUser.id);
            if (idx !== -1) { users[idx].passwordHash = newHash; delete users[idx].password; DB._setCache('tri_users', users); }
        }

        // 显示成功
        document.getElementById('pwd-reset-step1').style.display = 'none';
        document.getElementById('pwd-reset-step2').style.display = 'block';
        UI.toast('密码重置成功！', 'success');
    },
    _showResetError(msg) {
        const errEl = document.getElementById('reset-error');
        errEl.textContent = msg;
        errEl.style.display = 'block';
    },

    // ========== 用户管理（管理员） ==========
    async renderUserManagement() {
        if (!this.currentUser || !this.currentUser.isAdmin) {
            document.getElementById('user-mgmt-table').innerHTML = '<div class="empty-state"><div class="empty-icon">🔒</div><div class="empty-text">仅管理员可访问</div></div>';
            return;
        }
        UI.showLoading(document.getElementById('user-mgmt-table'));
        let users = [];
        try { users = await DB.getUsers(); } catch(e) { users = DB._getCache('tri_users', []); }

        // 也加入缓存中但云端可能没有的用户
        const cachedUsers = DB._getCache('tri_users', []);
        const userMap = {};
        users.forEach(u => userMap[u.id || u.username] = u);
        cachedUsers.forEach(u => {
            const key = u.id || u.username;
            if (!userMap[key]) { userMap[key] = u; users.push(u); }
        });

        // 计算每个用户的打卡次数
        const checkins = this._allCheckins.length > 0 ? this._allCheckins : DB._getCache('tri_checkins', []);
        const userCheckinCount = {};
        checkins.forEach(c => { userCheckinCount[c.userId] = (userCheckinCount[c.userId] || 0) + 1; });

        // 计算每个用户最近打卡时间
        const userLastCheckin = {};
        checkins.forEach(c => {
            if (!userLastCheckin[c.userId] || new Date(c.createdAt) > new Date(userLastCheckin[c.userId])) {
                userLastCheckin[c.userId] = c.createdAt;
            }
        });

        if (users.length === 0) {
            document.getElementById('user-mgmt-table').innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-text">暂无用户</div></div>';
            return;
        }

        const container = document.getElementById('user-mgmt-table');
        container.innerHTML = `<div class="user-table-wrap"><table class="user-table"><thead><tr>
            <th>用户名</th><th>昵称</th><th>角色</th><th>打卡次数</th><th>最近打卡</th><th>操作</th>
        </tr></thead><tbody>
        ${users.map(u => {
            const isAdmin = ADMIN_USERNAMES.includes(u.username) || u.isAdmin;
            const count = userCheckinCount[u.id] || 0;
            const lastTime = userLastCheckin[u.id] ? Utils.formatDateTime(userLastCheckin[u.id]) : '暂无';
            const roleBadge = isAdmin ? '<span class="admin-badge">👑 管理员</span>' : '<span class="user-badge">普通用户</span>';
            const resetBtn = `<button class="btn-reset-pwd" onclick="App.adminResetPassword('${u.id}', '${(u.username || '').replace(/'/g, "\\'")}')">🔑 重置密码</button>`;
            return `<tr>
                <td class="user-name-cell">${u.username || '-'}</td>
                <td>${u.nickname || '-'}</td>
                <td>${roleBadge}</td>
                <td>${count} 次</td>
                <td>${lastTime}</td>
                <td>${resetBtn}</td>
            </tr>`;
        }).join('')}
        </tbody></table></div>`;
    },

    adminResetPassword(userId, username) {
        const newPwd = prompt(`请输入「${username}」的新密码（至少4个字符）：`);
        if (!newPwd || newPwd.length < 4) { UI.toast('密码至少4个字符，操作取消', 'error'); return; }

        const confirmPwd = prompt(`请再次输入「${username}」的新密码以确认：`);
        if (newPwd !== confirmPwd) { UI.toast('两次密码不一致，操作取消', 'error'); return; }

        this._doAdminReset(userId, username, newPwd);
    },

    async _doAdminReset(userId, username, newPwd) {
        const newHash = await sha256(newPwd);
        try {
            await DB.updateUser(userId, { passwordHash: newHash, password: null });
        } catch(e) {
            console.warn('云端更新密码失败，使用本地', e);
        }
        // 更新本地缓存
        const users = DB._getCache('tri_users', []);
        const idx = users.findIndex(u => u.id === userId);
        if (idx !== -1) { users[idx].passwordHash = newHash; delete users[idx].password; DB._setCache('tri_users', users); }
        UI.toast(`「${username}」的密码已重置成功！`, 'success');
    },

    // ========== 训练计划库 ==========

        const content = document.getElementById('training-plan-content');
        content.innerHTML = `

            ${plan.phases.map(phase => `
                <div class="train-phase">
                    <div class="train-phase-header">${phase.phase}
                        <span class="train-weekly-total">周训练量约 ${Utils.formatDuration(phase.totalMins)}</span>
                    </div>
                    <table class="train-week-table">
                        <thead><tr><th>训练日</th><th>训练内容</th><th>时长</th></tr></thead>
                        <tbody>
                            ${phase.weeks.map(w => `<tr class="${w.duration === 0 ? 'rest-row' : ''}">
                                <td class="train-day">${w.day}</td>
                                <td class="train-content">${w.content}</td>
                                <td class="train-dur">${w.duration > 0 ? Utils.formatDuration(w.duration) : '休息'}</td>
                            </tr>`).join('')}
                        </tbody>
                    </table>
                    <div class="train-tip">${phase.tip}</div>
                </div>
            `).join('')}
        `;

        // 绑定Tab切换
        document.querySelectorAll('.train-tab-btn').forEach(btn => {
            btn.onclick = () => {
                this._currentTrainingGroup = btn.dataset.group;
                this.renderTrainingLibrary();
            };
        });
    }
};

document.addEventListener('DOMContentLoaded', () => { App.init(); });
</script>
</body>
</html>
